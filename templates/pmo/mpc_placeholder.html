{% extends 'base.html' %}

{% block title %}{{ title }} - {{ project.project_name }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<a href="{% url 'pmo:mpc_project_overview' project.pk %}" class="text-muted small d-inline-block mb-3"><i class="bi bi-arrow-left"></i> {{ project.project_name }}</a>

<div class="card border-0" style="border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);">
    <div class="card-body text-center py-5">
        <div class="mb-3">
            <i class="bi {{ icon }}" style="font-size: 2.5rem; color: #C41E3A;"></i>
        </div>
        <h5 class="fw-bold">{{ title }}</h5>
        <p class="text-muted mb-0">{{ description }}</p>
    </div>
</div>
{% endblock %}
