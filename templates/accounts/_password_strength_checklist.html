<div class="pwd-strength-checklist small mb-2" style="display:none;">
    <div data-rule="length" class="text-danger"><i class="bi bi-x-circle"></i> At least 8 characters</div>
    <div data-rule="upper" class="text-danger"><i class="bi bi-x-circle"></i> One uppercase letter</div>
    <div data-rule="lower" class="text-danger"><i class="bi bi-x-circle"></i> One lowercase letter</div>
    <div data-rule="number" class="text-danger"><i class="bi bi-x-circle"></i> One number</div>
    <div data-rule="special" class="text-danger"><i class="bi bi-x-circle"></i> One special character (!@#$%^&*)</div>
</div>
<script>
(function() {
    var RULES = {
        length: function(v) { return v.length >= 8; },
        upper: function(v) { return /[A-Z]/.test(v); },
        lower: function(v) { return /[a-z]/.test(v); },
        number: function(v) { return /\d/.test(v); },
        special: function(v) { return /[!@#$%^&*()_\-+=\[\]{};:'"\\|,.<>\/?~`]/.test(v); }
    };
    document.querySelectorAll('.pwd-strength-checklist').forEach(function(box) {
        var input = document.querySelector('input[name="password1"]');
        if (!input) return;
        input.addEventListener('focus', function() { box.style.display = 'block'; });
        input.addEventListener('input', function() {
            var v = input.value;
            Object.keys(RULES).forEach(function(key) {
                var el = box.querySelector('[data-rule="' + key + '"]');
                var ok = RULES[key](v);
                el.classList.toggle('text-success', ok);
                el.classList.toggle('text-danger', !ok);
                el.querySelector('i').className = ok ? 'bi bi-check-circle' : 'bi bi-x-circle';
            });
        });
    });
})();
</script>
