databases:
  - name: leap-erp-db
    databaseName: leap_erp
    user: leap_erp_user
    # Paid tier — this is production data. The paid plan is what provides
    # daily backups and point-in-time recovery (how the commercial pipeline
    # was recovered after an accidental deletion). Do NOT drop this to free:
    # the free tier has no backups/PITR and expires.
    plan: basic_1gb

services:
  - type: web
    name: leap-erp
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # --timeout 180 so slow object-storage I/O and the synchronous AI quotation
    # extraction (a multi-second Claude call) aren't killed by gunicorn's 30s
    # default — a kill strands the quotation import at "pending". Must exceed the
    # Anthropic client timeout (100s) set in quotation_extract.py.
    startCommand: "gunicorn erp_leap.wsgi:application --timeout 180 --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leap-erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Cloudflare R2 (object storage for uploaded documents).
      # USE_R2 toggles the S3 backend on. The four R2 secrets are set via
      # the Render dashboard → Environment, never committed to git.
      - key: USE_R2
        value: "True"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      # Anthropic API key — powers AI quotation extraction (and the dev-tracking
      # digest). Set the value in the Render dashboard → Environment; never
      # commit it. Without it, quotation import shows "AI extraction is not
      # configured".
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PROCUREMENT_AI_MODEL
        value: "claude-sonnet-4-6"
