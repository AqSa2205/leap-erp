databases:
  - name: leap-erp-db
    databaseName: leap_erp
    user: leap_erp_user
    plan: free

services:
  - type: web
    name: leap-erp
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # --timeout 120 so a slow Cloudflare R2 upload (e.g. the signature image on
    # PO approval) isn't killed by gunicorn's 30s default — that kill surfaces
    # in the browser as an opaque "Network error".
    startCommand: "gunicorn erp_leap.wsgi:application --timeout 120 --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leap-erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Cloudflare R2 (object storage for uploaded documents).
      # USE_R2 toggles the S3 backend on. The four R2 secrets are set via
      # the Render dashboard → Environment, never committed to git.
      - key: USE_R2
        value: "True"
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      # Anthropic API key — powers AI quotation extraction (and the dev-tracking
      # digest). Set the value in the Render dashboard → Environment; never
      # commit it. Without it, quotation import shows "AI extraction is not
      # configured".
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PROCUREMENT_AI_MODEL
        value: "claude-sonnet-4-6"
